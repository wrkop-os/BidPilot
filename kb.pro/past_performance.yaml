# Past performance library — the ONLY source writers may cite for
# past-performance claims (FR-10). historical_actuals feed analogy
# estimating (A8): keep them quantitative — hours by category, unit
# productivities, staffing ratios — not adjectives.
- kb_id: pp-army-esd
  customer: "U.S. Army (ACC-Rock Island)"
  contract_number: "W52P1J-21-C-0087"
  value: 4600000
  period: "2021-09 to 2025-08"
  scope_narrative: >
    Enterprise service desk operations for 6,800 users across 4 installations:
    Tier I/II incident and request management (~8,200 tickets/month), ITSM
    platform administration (ServiceNow), knowledge base management, VIP
    support, and 24x5 coverage with on-call after-hours rotation. Achieved
    74% first-contact resolution and 96% SLA attainment across 47 monthly
    service periods; transitioned-in from incumbent in 45 days with zero
    service interruption.
  naics_codes: ["541513", "541519"]
  cpars_rating: "Very Good"
  reference_contact: "co.rock-island@army.mil"
  role: prime
  historical_actuals: >
    Steady state staffing: 11 Tier I agents, 6 Tier II techs, 1 service desk
    lead, 0.5 FTE PM. Tier I averaged 470 contacts/agent/month at 55%
    utilization and 11-minute average handle time; Tier II averaged 118
    tickets/tech/month (both consistent with MetricNet/HDI norms: L2 average
    113 tickets/tech/month, range 30-198). Demand ratio: 1.21
    tickets/user/month. Priced at 1,880 productive hours/FTE. Fully loaded
    cost per ticket: $27 Tier I, $86 Tier II (2024 dollars).
  governance: { owner: "mreyes", last_verified: "2026-07-10" }

