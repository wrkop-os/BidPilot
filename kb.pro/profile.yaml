# 3-tier DCAA-style structure (fringe / contractor-site overhead / G&A on
# TCI), inside the advisory-consensus bands for a 50-person services firm:
# fringe 25-40% (consensus mid ~30-32), OH 30-50% contractor-site, G&A 8-15%,
# services fee 5-8%. Compounded wrap = 1.31 x 1.36 x 1.11 x 1.07 = 2.11 —
# inside the competitive 2.00-2.25 DC-metro small-business band (below ~2.0
# reads aggressive, above ~2.3 loses LPTA). Client-site work re-prices with
# the ~18% site overhead pool per content-pricing-policy. Escalation 3.0%
# tied to BLS ECI (trailing readings 3.3-3.5%).
