[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bidpilot"
version = "0.1.0"
description = "Agentic AI system for federal contract analysis & proposal generation (SAM.gov opportunity URL -> submission-ready proposal package)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=0.120.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
tables = ["pdfplumber>=0.11"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
ml = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
e2e = [
    "playwright>=1.40",
]

[project.scripts]
bidpilot = "bidpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bidpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
