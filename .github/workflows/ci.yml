name: CI

# PRD cross-phase cadence: every change re-runs the deterministic test suite
# before merge. (The 25-corpus eval sweep needs live artifacts + keys and runs
# out-of-band; the demo-corpus eval below gates the deterministic slice.)
#
# `schedule` only fires from the default branch, so the nightly drift check
# goes live once this workflow lands on main.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

# head_ref||ref_name puts a branch push and its PR run in the same group so
# one supersedes the other; scheduled runs get their own group and are never
# cancelled, so a push to main can't silently kill the nightly drift check.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || (github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,tables,ml]"
      - name: Run tests
        run: python -m pytest -q
      - name: Eval harness (demo corpus, deterministic)
        run: python -m evals.harness evals/corpus_demo/sample_extracted_matrix.json evals/corpus_demo/gold_matrix.csv
      - name: CLI smoke
        run: |
          bidpilot --help > /dev/null
          bidpilot doctor --kb kb.example || true   # informational; env has no keys

  # Real-browser e2e (headless Chromium drives the gates UI against the fake
  # router). Installed explicitly here — without the e2e extra these tests
  # importorskip and silently vanish from the signal.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,tables,server,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser e2e
        run: python -m pytest tests/test_browser_e2e.py -q -rs

  # Exact page-count path (LibreOffice) exercised separately so the main job stays fast.
  render-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice Writer
        run: sudo apt-get update -q && sudo apt-get install -y -q libreoffice-writer
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify exact page counting
        run: |
          python - <<'EOF'
          from pathlib import Path
          import tempfile
          from bidpilot.models import FormatConstraints, SectionDraft
          from bidpilot.rendering import render_all_volumes, soffice_conversion_works

          assert soffice_conversion_works(), "soffice conversion probe failed"
          md = "## T\n" + ("prose sentence here. " * 900)
          draft = SectionDraft(section_id="T", volume="Volume I", title="T",
                               markdown=md, word_count=len(md.split()))
          with tempfile.TemporaryDirectory() as tmp:
              rv = render_all_volumes([draft], FormatConstraints(), Path(tmp), None, None)[0]
              assert rv.page_count is not None and rv.page_count > 1, rv
              print("exact pages:", rv.page_count)
          EOF
