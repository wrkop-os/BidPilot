- kb_id: content-quality-plan
  title: "Quality Control Plan (baseline)"
  kind: quality_plan
  text: >
    Our QCP uses a three-tier inspection model: peer review on every
    deliverable, weekly PM quality audits against the PWS performance
    standards, and monthly management reviews with corrective-action tracking
    in our QMS. Metrics are reported in the Monthly Status Report.
  governance: { owner: "jrivera", last_verified: "2026-02-20" }

